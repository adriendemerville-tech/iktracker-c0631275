name = "iktracker-bot-router"
main = "iktracker-bot-router.js"
compatibility_date = "2025-01-01"

# Routes multi-zones (apex + www + .com)
# Ces routes doivent déjà exister côté Cloudflare pour les zones concernées.
routes = [
  { pattern = "iktracker.fr/*", zone_name = "iktracker.fr" },
  { pattern = "www.iktracker.fr/*", zone_name = "iktracker.fr" },
  { pattern = "iktracker.com/*", zone_name = "iktracker.com" },
  { pattern = "www.iktracker.com/*", zone_name = "iktracker.com" },
]

# Observabilité (logs Cloudflare)
[observability]
enabled = true
