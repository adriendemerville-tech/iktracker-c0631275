name = "iktracker-bot-router"
main = "iktracker-bot-router.js"
compatibility_date = "2025-01-01"

# Routes actives (apex + www .fr)
# Les zones .com/.app restent en awaiting_dns ; on les réactivera quand elles seront proxifiées.
routes = [
  { pattern = "iktracker.fr/*", zone_name = "iktracker.fr" },
  { pattern = "www.iktracker.fr/*", zone_name = "iktracker.fr" },
]

# Observabilité (logs Cloudflare)
[observability]
enabled = true
